[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cronos"
version = "0.1.0"
description = "Black Box Recorder for AI Agents — Slack Agent Builder Challenge 2026"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["cronos*", "slack*", "demo*"]
